<!doctype html>
<!-- biome-ignore lint/a11y/useValidLang: SvelteKit replaces %lang% at runtime -->
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<link rel="manifest" href="%sveltekit.assets%/webmanifest.json" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Radio+Canada:ital,wdth,wght@0,75..100,300..700;1,75..100,300..700&family=Recursive:wght@300..1000&family=Rosario:ital,wght@0,300..700;1,300..700&display=swap"
			rel="stylesheet"
		/>

		<!-- --gray-1 per scheme; +layout.svelte rewrites both once the app theme is known -->
		<meta name="theme-color" content="#fefbf7" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#15110b" media="(prefers-color-scheme: dark)" />
		<!-- Saved theme and sidebar labels, before first paint -->
		<script>
			try {
				const t = JSON.parse(localStorage.getItem('r5-app-state'))?.theme
				if (t === 'light' || t === 'dark') document.documentElement.classList.add(t)
				if (localStorage.getItem('r5:layout-header-labels-visible') === '0')
					document.documentElement.classList.add('nav-labels-hidden')
			} catch {}
		</script>
		<!-- <script src="'https://www.youtube.com/iframe_api'"></script> -->

		<!-- Title and description come from the Seo component. Hardcoding them here
		     too would emit a second, always-wrong one on server-rendered pages. -->
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
